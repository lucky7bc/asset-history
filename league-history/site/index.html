<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f3f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05091d" media="(prefers-color-scheme: dark)">
<title>League Asset History</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="League History">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f1f3f9;--card:#fff;--bd:#d5d9e8;--fg:#05091d;--mut:#4a5170;--ac:#2f5bec;--tag:#e3e6f0;--hit:#e2e8ff;--line:#9aa3bf;--lpos:#059669;--lneg:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05091d;--card:#0e1430;--bd:#232b52;--fg:#eef1ff;--mut:#a3acd6;--ac:#6c93ff;--tag:#1b2350;--hit:#16224f;--line:#3a4580;--lpos:#34d399;--lneg:#f87171}}
:root[data-theme="dark"]{--bg:#05091d;--card:#0e1430;--bd:#232b52;--fg:#eef1ff;--mut:#a3acd6;--ac:#6c93ff;--tag:#1b2350;--hit:#16224f;--line:#3a4580;--lpos:#34d399;--lneg:#f87171}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 12px;letter-spacing:-.01em}
h2{font-size:1.5rem;margin:6px 0 0;letter-spacing:-.01em}
a{color:var(--ac);text-decoration:none;font-weight:600}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hint,.sub{color:var(--mut);font-size:.85rem;margin:2px 0 14px}
.results{list-style:none;margin:12px 0 0;padding:0}
.res{display:flex;gap:10px;align-items:center;min-height:48px;padding:8px 10px;margin-bottom:6px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font-weight:500;overflow:hidden}
.res small{display:block;color:var(--mut);font-weight:400;font-size:.78rem}
.av{position:relative;overflow:hidden;width:28px;height:28px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--tag);color:var(--fg)}
.av.sq{border-radius:7px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--tag)}
.spine{position:relative;margin-top:6px}
.spine::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.c{text-align:center;position:relative}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--fg)}
.pill.now{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gap{height:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 14px;position:relative}
.side{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;min-width:0}
.th{display:flex;gap:7px;align-items:center;margin-bottom:2px}
.team{font-size:.78rem;font-weight:700;line-height:1.2}.lbl{font-size:.7rem;color:var(--mut)}
.asset{display:flex;gap:7px;align-items:center;padding:7px;margin-top:6px;border-radius:8px;background:var(--bg);color:var(--fg);font-size:.82rem;font-weight:500;min-height:44px}
.asset .nm{min-width:0}.asset small{display:block;font-size:.7rem;color:var(--mut);font-weight:400}
.asset small.bec{color:var(--ac);font-weight:600}
.hit{background:var(--hit);outline:2px solid var(--ac)}
.none{font-size:.75rem;color:var(--mut);padding:8px 2px}
.badge{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center}
.node{display:inline-flex;width:32px;height:32px;border-radius:9px;background:var(--ac);color:var(--bg);align-items:center;justify-content:center}
.hero{background:var(--fg);color:var(--bg);border-radius:16px;padding:16px;text-align:center;margin:8px 0 14px;position:relative}
.hero a{color:var(--bg)}
.hero .hl{font-size:.78rem;font-weight:600;opacity:.85}
.hero .big{display:flex;justify-content:center;margin:12px 0 8px}
.hero .big .av{width:64px;height:64px;font-size:18px;background:var(--ac);color:var(--bg)}
.hero .hn{font-size:1.25rem;font-weight:700}
.hero .hs{font-size:.8rem;opacity:.85}
.hero .chips{display:flex;justify-content:center;gap:8px;margin:12px 0}
.hero .chips span{padding:5px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--bg) 18%,transparent)}
.chips{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto}
.chip{flex:none;padding:7px 12px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.card2{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.ttl{font-weight:700;font-size:.85rem;margin-bottom:6px}
.dr{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);color:var(--fg);font-weight:500;font-size:.85rem}
.dr .no{width:34px;font-size:.75rem;font-weight:700;color:var(--mut)}
.dr .nm{flex:1;min-width:0}.dr small{display:block;font-size:.72rem;color:var(--mut);font-weight:400}
.dr .rt{text-align:right;font-size:.75rem;flex:none;max-width:40%}.dr .rt small{color:var(--ac);font-weight:600}
.pbw{overflow-x:auto}
.pb{display:grid;grid-template-columns:minmax(120px,1.6fr) repeat(var(--r),minmax(46px,1fr));align-items:center;text-align:center;border-top:1px solid var(--bd);padding:7px 0;font-size:.78rem}
.pb.h{border:0;color:var(--mut);font-size:.7rem}
.pb .tn{display:flex;gap:6px;align-items:center;text-align:left;font-weight:600;min-width:0}
.pb .tn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut)}
.chipt{display:inline-block;background:var(--ac);color:var(--bg);border-radius:6px;padding:3px 7px;margin:1px;font-size:.7rem;font-weight:700}
.pt{margin-left:auto;font-size:.8rem;padding-left:6px}
.tot{font-size:1.75rem;font-weight:700}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0;background:var(--tag)}
.bar i{background:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ppts{background:rgba(16,185,129,.15);color:var(--lpos);padding:2px 8px;border-radius:12px;font-weight:600;font-size:.75rem;white-space:nowrap;display:inline-block;margin-top:3px}
.ow{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;display:inline-block;vertical-align:bottom}
.ow.exp{max-width:none;white-space:normal;word-break:break-word}
.pln{color:var(--fg);font-weight:600;text-decoration:none;flex:1;min-width:0}
.rr{padding:10px 0;border-top:1px solid var(--bd);font-size:.82rem;display:flex;gap:10px;align-items:center}
.rr b{min-width:52px;font-size:1rem}.rr .ri{flex:1;min-width:0;color:var(--mut);text-align:right}
.lrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:.82rem}
.lp{font-weight:700;font-size:.88rem;min-width:44px;text-align:right}
.lpos{color:var(--lpos)}.lneg{color:var(--lneg)}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--bd);font-size:.82rem}
.pi{display:block;line-height:1.15;margin:3px 0}
.pp{display:block;font-size:.65rem;color:var(--mut)}
/* ─── Responsive ─────────────────────────────────────────── */
#nav{scrollbar-width:none;-webkit-overflow-scrolling:touch}
#nav::-webkit-scrollbar{display:none}
.unm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
@media(max-width:360px){
  main{padding:12px}
  h2{font-size:1.3rem}
  .chip{padding:5px 9px;font-size:.74rem}
  .row{gap:8px;margin:6px 0 10px}
  .side{padding:6px}
  .asset{padding:5px;gap:5px;font-size:.78rem;min-height:40px}
  .dr .no{width:26px}
  .ow{max-width:76px}
  .badge{width:22px;height:22px;margin:-11px}
}
@media(max-width:480px){
  .row{gap:10px}
  .side{padding:7px}
  .ow{max-width:108px}
  .pill{max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unm{max-width:72px}
}
@media(min-width:600px){
  main{max-width:600px}
}
@media(min-width:768px){
  main{max-width:740px;padding:24px 32px}
  h1{font-size:1.6rem}
  h2{font-size:1.75rem}
  .row{gap:18px}
  .side{padding:12px}
  .asset{padding:9px;font-size:.9rem}
  .ow{max-width:180px}
  .dr{font-size:.9rem}
  .chip{padding:8px 14px}
  .card2{padding:16px}
}
@media(min-width:1024px){
  main{max-width:900px;padding:32px 40px}
  h1{font-size:1.8rem}
  h2{font-size:1.9rem}
}
/* ─── PWA install modal ───────────────────────────────────── */
#pwa-modal:not([hidden]){position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;box-sizing:border-box}
.pwa-card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.pwa-ico{width:80px;height:80px;border-radius:18px;margin:0 auto 14px;display:block;object-fit:cover}
.pwa-h{font-size:1.1rem;font-weight:700;margin:0 0 6px;line-height:1.3}
.pwa-sub{font-size:.82rem;color:var(--mut);margin:0 0 14px;line-height:1.45}
.pwa-steps{background:var(--bg);border-radius:10px;padding:11px 13px;font-size:.8rem;text-align:left;margin-bottom:16px;line-height:1.6;color:var(--fg)}
.pwa-btns{display:flex;flex-direction:column;gap:10px}
.pwa-btn-main{padding:14px;border-radius:11px;border:0;background:linear-gradient(135deg,#c9941a,#f0c040);color:#05091d;font:700 .9rem Inter,system-ui,sans-serif;cursor:pointer;letter-spacing:.01em}
.pwa-btn-sec{padding:12px;border-radius:11px;border:1px solid var(--bd);background:transparent;color:var(--mut);font:600 .88rem Inter,system-ui,sans-serif;cursor:pointer}
#pwa-tip:not([hidden]){position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.8rem;text-align:center;max-width:270px;width:max-content;box-shadow:0 4px 24px rgba(0,0,0,.5);z-index:9998;display:block;animation:fadeUp .25s ease}
#pwa-tip::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--fg);border-bottom:0}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
footer{margin-top:28px;font-size:.78rem;color:var(--mut)}
/* ─── Rivalry Engine ──────────────────────────────────────── */
.rv-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:4px}
.rv-card{padding:14px!important;background:var(--hit)!important}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:0}
.rv-mgr{text-align:center;min-width:0;flex:1}
.rv-mgr .av{width:42px;height:42px;font-size:14px;margin:0 auto 5px}
.rv-mgr-name{font-size:.78rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-vs{text-align:center;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.rv-vs-txt{font-size:1rem;font-weight:800;letter-spacing:.05em;color:var(--mut)}
.rv-tier{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--tag);color:var(--fg);white-space:nowrap}
.rv-sec{padding:8px 0;border-top:1px solid var(--bd);font-size:.82rem}
.rv-rec{text-align:center}
.rv-rec-lead{font-weight:700;display:block;margin-bottom:3px}
.rv-streak{font-size:.75rem;color:var(--mut)}
.rv-l5{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.rv-chip{padding:4px 8px;border-radius:7px;font-size:.74rem;font-weight:700;line-height:1.3}
.rv-w{background:rgba(16,185,129,.18);color:var(--lpos)}
.rv-l{background:rgba(248,113,113,.18);color:var(--lneg)}
.rv-meter-lbl{font-size:.78rem;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.rv-meter-lbl small{font-size:.7rem;color:var(--mut);font-weight:400}
.rv-meter{height:7px;border-radius:4px;background:var(--tag);overflow:hidden}
.rv-meter-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ac),#f59e0b);transition:width .7s cubic-bezier(.4,0,.2,1)}
.rv-recent-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:.78rem}
.rv-moments{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--mut)}
.rv-moments b{color:var(--fg)}
.rv-avg{font-size:.78rem;color:var(--mut);text-align:center}
@media(min-width:600px){.rv-grid{grid-template-columns:1fr 1fr}}
/* ─── Bottom tab bar ──────────────────────────────────────── */
#tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);display:none;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tab-bar::-webkit-scrollbar{display:none}
#tab-bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 7px;gap:3px;color:var(--mut);text-decoration:none;font-size:.6rem;font-weight:600;line-height:1.1;min-height:52px;flex:none;min-width:62px}
#tab-bar a.on{color:var(--ac)}
#tab-bar a svg{width:20px;height:20px;flex:none;stroke-width:1.75}
/* ─── Dashboard ───────────────────────────────────────────── */
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.dash-tile{display:flex;flex-direction:column;gap:3px;padding:14px 12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--fg);text-decoration:none}
.dash-tile:hover,.dash-tile:focus-visible{background:var(--hit)}
.dash-tile-icon{color:var(--ac)}
.dash-tile-icon svg{width:22px;height:22px;display:block}
.dash-tile-name{font-size:.88rem;font-weight:700;margin-top:4px}
.dash-tile-teaser{font-size:.74rem;color:var(--mut);line-height:1.35}

@media(max-width:599px){main{padding-bottom:68px}#tab-bar{display:flex}#nav{display:none}}
@media(min-width:480px){.dash-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:479px){.dash-tile:last-child:nth-child(odd){grid-column:span 2}}
@media(min-width:480px){.dash-tile:last-child:nth-child(3n+1){grid-column:span 3}}
/* ─── Dynasty Timeline ────────────────────────────────────── */
.tl{position:relative;padding:4px 0 32px}
.tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bd);transform:translateX(-50%);pointer-events:none}
.tl-ev{position:relative;display:flex;margin-bottom:20px}
.tl-dot{position:absolute;left:50%;top:14px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--bg);transform:translateX(-50%);z-index:2;flex:none}
.tl-dot-champ{background:#f59e0b;width:14px;height:14px;top:12px}
.tl-dot-rec{background:var(--lpos)}
.tl-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-size:.82rem}
.tl-l{justify-content:flex-start}.tl-l .tl-card{width:calc(50% - 20px)}
.tl-r{justify-content:flex-end}.tl-r .tl-card{width:calc(50% - 20px)}
.tl-full{display:block}.tl-full .tl-dot{position:absolute;left:50%;transform:translateX(-50%)}
.tl-full .tl-card{width:100%}
.tl-ev-type{font-size:.7rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.tl-season-card{background:var(--tag)!important;display:flex;align-items:center;justify-content:space-between;padding:10px 16px!important}
.tl-year{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.tl-champ-card{text-align:center;background:linear-gradient(135deg,var(--hit),var(--card))!important}
.tl-champ-trophy{font-size:2rem;margin-bottom:4px}
.tl-champ-title{font-size:.74rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.tl-champ-team{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;font-weight:700}
.tl-rec-card{border-left:3px solid var(--lpos)!important}
.tl-rec-stat{font-size:1.2rem;font-weight:800;margin:4px 0 2px}
.tl-rec-label{font-size:.74rem;color:var(--mut);margin-bottom:6px}
.tl-rec-who{display:flex;align-items:center;gap:5px;font-size:.77rem;flex-wrap:wrap}
.tl-trade-row{display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.tl-trade-side{flex:1;min-width:0}
.tl-trade-side-r{text-align:right}
.tl-trade-mgr{font-weight:600;font-size:.77rem;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-trade-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;margin:3px 0 2px}
.tl-trade-items{font-size:.82rem;line-height:1.5}
.tl-trade-div{flex:none;font-size:1rem;color:var(--mut);padding-top:1px;align-self:center}
.tl-mu-row{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.tl-mu-team{display:flex;align-items:center;gap:6px;font-size:.82rem}
.tl-mu-score{font-weight:700;margin-left:auto}
.tl-mu-sep{font-size:.7rem;color:var(--mut);padding-left:30px}
.tl-headshots{display:flex;gap:5px;margin:5px 0}
.tl-draft-pick{font-size:.75rem;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:599px){
  .tl::before{left:16px;transform:none}
  .tl-dot,.tl-full .tl-dot{left:16px;transform:none}
  .tl-ev:not(.tl-full){padding-left:36px;justify-content:flex-start}
  .tl-l .tl-card,.tl-r .tl-card{width:100%}
  .tl-full{padding-left:36px}
  .tl-full .tl-card{width:100%}
}
/* ─── Prophecy Board ──────────────────────────────────────── */
.pb-identity-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:.82rem}
.pb-who-select{flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--tag);color:var(--fg);font-size:.82rem;cursor:pointer}
.pb-state-banner{text-align:center;padding:14px 16px;background:var(--tag);border-radius:12px;margin-bottom:14px;font-size:.84rem;line-height:1.4}
.pb-state-icon{font-size:1.5rem;display:block;margin-bottom:5px}
.pb-matchups{display:flex;flex-direction:column;gap:10px}
.pb-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.pb-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pb-team{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1}
.pb-team-name{font-size:.78rem;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.pb-vs{font-size:.8rem;font-weight:700;color:var(--mut);flex:none}
.pb-input-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.pb-input{flex:1;padding:9px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--tag);color:var(--fg);font-size:1.1rem;font-weight:700;text-align:center;min-width:0}
.pb-input:focus{outline:none;border-color:var(--ac)}
.pb-btn{padding:9px 18px;background:var(--ac);color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:.88rem;white-space:nowrap}
.pb-btn:hover{opacity:.85}.pb-btn:disabled{opacity:.5;cursor:default}
.pb-hint{font-size:.74rem;color:var(--mut);text-align:center;margin-top:5px}
.pb-locked-pill{font-size:.74rem;padding:3px 10px;border-radius:99px;background:var(--tag);color:var(--mut)}
.pb-confirmed{border-color:var(--lpos)!important}
.pb-confirmed-label{font-size:.78rem;color:var(--lpos);font-weight:600;text-align:center;margin-top:6px}
.pb-result-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:.82rem;border-top:1px solid var(--bd)}
.pb-result-row:first-child{border-top:none}
.pb-err-low{color:var(--lpos)}.pb-err-mid{color:#f59e0b}.pb-err-hi{color:var(--lneg)}
.pb-prophet-banner{background:linear-gradient(135deg,var(--hit),var(--card));border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center;margin-bottom:14px}
.pb-p-icon{font-size:1.8rem;display:block;margin-bottom:5px}
.pb-lb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);font-size:.82rem}

.pb-lb-info{flex:1;min-width:0}

.pb-lb-err{font-weight:700;font-size:.88rem;text-align:right;flex:none}
/* ─── Mobile bug fixes ────────────────────────────────────── */
/* Fix 2: prevent iOS auto-zoom on select (triggers on font-size < 16px) */

</style>

<body>
<main>
  <div class="app-header">
    <button id="theme-btn" onclick="toggleTheme()" aria-label="Toggle color scheme"></button>
  </div>
  <nav id="nav" class="chips"></nav>

      <h3 class="pwa-h">Welcome to the<br>Big Boy Dynasty League</h3>
      <p class="pwa-sub">Your dynasty hub — built to complement your league on Sleeper.</p>
      <div id="pwa-steps" class="pwa-steps"></div>
      <div class="pwa-btns">
        <button id="pwa-action" class="pwa-btn-main"></button>
        <button id="pwa-later" class="pwa-btn-sec">Maybe Later</button>
      </div>
    </div>
  </div>
  <div id="pwa-tip" hidden aria-live="polite"></div>
  <nav id="tab-bar"></nav>
</main>
<script>
/* ── PWA install prompt ──────────────────────────────────── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
(function initPWA() {
  if (window.matchMedia('(display-mode:standalone)').matches || navigator.standalone) return;
  try { if (localStorage.getItem('pwa-dismissed')) return; } catch (_) {}
  const ua = navigator.userAgent;
  if (!/Android|iPhone|iPad|iPod/.test(ua)) return; // desktop: skip
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const modal = document.getElementById('pwa-modal');
  const steps = document.getElementById('pwa-steps');
  const action = document.getElementById('pwa-action');
  const later  = document.getElementById('pwa-later');
  const tip    = document.getElementById('pwa-tip');
  if (isIOS) {
    steps.innerHTML = 'Open this link in <strong>Safari</strong>. Tap the <strong>Share ↑</strong> button at the bottom of the screen, then tap <strong>Add to Home Screen</strong>.<br><small style="color:var(--mut)">Chrome and other iOS browsers cannot install apps.</small>';
    action.textContent = 'Show me how';
    action.onclick = () => {
      modal.hidden = true;
      tip.innerHTML = 'Tap <strong>Share ↑</strong> below, then <strong>Add to Home Screen</strong>';
      tip.hidden = false;
      setTimeout(() => { tip.hidden = true; }, 9000);
    };
  } else {
    steps.innerHTML = 'Tap the browser menu <strong>⋮</strong> and look for <strong>Add to Home Screen</strong> or <strong>Install App</strong>.';
    action.textContent = 'Install App';
    action.onclick = async () => {
      if (deferredPrompt) {
        await deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') {
          try { localStorage.setItem('pwa-dismissed','1'); } catch (_) {}
          modal.hidden = true;
        }
      } else {
        modal.hidden = true;
        tip.innerHTML = 'Tap <strong>⋮</strong> in your browser, then <strong>Add to Home Screen</strong>';
        tip.hidden = false;
        setTimeout(() => { tip.hidden = true; }, 9000);
      }
    };
  }
  later.onclick = () => {
    try { localStorage.setItem('pwa-dismissed','1'); } catch (_) {}
    modal.hidden = true;
  };
  modal.hidden = false;
})();


const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ord = n => ({1:"1st",2:"2nd",3:"3rd"}[n] || n + "th");
const fmt = ms => ms ? new Date(ms).toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"}) : "";
const ARROW = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>`;
const TICKET = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/></svg>`;
const NAV_ICONS = {
  home:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  draft:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
  h2h:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  records: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`,
  luck:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  rivalry: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
  search:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  prophecy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="7"/><path d="M8.5 7A4.5 4.5 0 0 1 14 5.5"/><path d="M9 21h6"/><path d="M12 17v4"/></svg>`,
  timeline: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="2" x2="12" y2="22"/><circle cx="12" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"/><line x1="12" y1="6" x2="20" y2="6"/><line x1="12" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>`,
};
let D, ITEMS = [], MATCHUPS = [], TL_EVENTS = [], PROPHET_OID = null;

/* ---------- lookups ---------- */
function teamObj(season, rid) {
  const t = D.teams[season]?.[rid];
  if (t) return t;
  for (const s of Object.keys(D.teams).sort().reverse()) if (D.teams[s][rid]) return D.teams[s][rid];
  return {name: "Team " + rid};
}
const team = (s, rid) => teamObj(s, rid).name;
const pname = pid => D.players[pid]?.name || pid;
const pickKey = p => `${p.season}-${p.round}-${p.roster_id}`;
const pickLabel = k => { const [s, r, o] = k.split("-"); return `${s} ${ord(+r)}-round pick (orig. ${teamUsername(s, o)})`; };

/* ---------- faces (image over initials; a failed image just disappears) ---------- */
const ini = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const av = (src, name, sq) => `<span class="av${sq ? " sq" : ""}">${esc(ini(name))}${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
const headshot = pid => av(`https://sleepercdn.com/content/nfl/players/thumb/${pid}.jpg`, pname(pid));
const teamAv = (s, rid) => { const t = teamObj(s, rid); return av(t.avatar ? `https://sleepercdn.com/avatars/thumbs/${t.avatar}` : null, t.name); };

const username = oid => (D.users?.[oid]?.name || oid || "?") + (PROPHET_OID && oid === PROPHET_OID ? " 🔮" : "");
const teamUsername = (ss, rid) => { const t = teamObj(ss, rid); return t?.owner_id ? username(t.owner_id) : t?.name || "Team " + rid; };
const uav = oid => av(D.users?.[oid]?.avatar ? `https://sleepercdn.com/avatars/thumbs/${D.users[oid].avatar}` : null, username(oid));
function getOwners() {
  const seen = new Set();
  return Object.values(D.teams).flatMap(ss => Object.values(ss)).map(t => t.owner_id).filter(x => x && !seen.has(x) && seen.add(x));
}
function assetHtml(a, hit, val = "") {
  let icon, name, sub = "", href = "", extra = "";
  if (a.kind === "player") {
    const p = D.players[a.id] || {};
    icon = headshot(a.id); name = pname(a.id); sub = [p.pos, p.team].filter(Boolean).join(" · "); href = "#player/" + a.id;
  } else if (a.kind === "pick") {
    const [s, r, o] = a.key.split("-");
    icon = `<span class="av sq">${TICKET}</span>`; name = `${s} ${ord(+r)}`; sub = "orig. " + team(s, o); href = "#pick/" + a.key;
    const d = D.draft_results[a.key];
    if (d) extra = `<small class="bec">→ ${esc(pname(d.player_id))}</small>`;
  } else { icon = `<span class="av">$</span>`; name = `$${a.amount} FAAB`; }
  const tag = href ? "a" : "div";
  return `<${tag} class="asset${hit ? " hit" : ""}"${href ? ` href="${esc(href)}"` : ""}>${icon}<span class="nm">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ""}${extra}</span>${val ? `<b class="pt">${esc(val)}</b>` : ""}</${tag}>`;
}

/* ---------- trades: left = what the sender got back, right = what the receiver got ---------- */
function receipts(t) {
  const m = {}, add = (rid, a) => (m[rid] = m[rid] || []).push(a);
  for (const [pid, rid] of Object.entries(t.adds)) add(rid, {kind: "player", id: pid});
  for (const p of t.picks) add(p.to, {kind: "pick", key: pickKey(p)});
  for (const w of t.faab) add(w.to, {kind: "faab", amount: w.amount});
  return m;
}
function tradeRow(t, from, to, isTracked) {
  const rc = receipts(t);
  const col = (rid, label, empty) => `<div class="side"><div class="th">${teamAv(t.season, rid)}<div><div class="team">${esc(team(t.season, rid))}</div><div class="lbl">${label}</div></div></div>
    ${(rc[rid] || []).map(a => assetHtml(a, isTracked(a))).join("") || `<div class="none">${empty}</div>`}</div>`;
  const n = Object.keys(rc).length;
  return `<div class="c"><a class="pill" href="#trade/${esc(t.id)}">${esc(fmt(t.created))} · points ›</a></div>
    <div class="row">${col(from, "Sent it for", "Nothing back")}${col(to, "Acquired", "")}<span class="badge" aria-hidden="true">${ARROW}</span></div>
    ${n > 2 ? `<div class="sub c" style="margin-top:-8px">${n}-team trade: showing the two teams on this asset’s path</div>` : ""}`;
}
const pill = (txt, cls = "", href = "") => `<div class="c"><${href ? "a" : "span"} class="pill ${cls}"${href ? ` href="${esc(href)}"` : ""}>${esc(txt)}</${href ? "a" : "span"}></div><div class="gap"></div>`;

/* ---------- views ---------- */
function draftHero(key, d) {
  const n = Object.keys(D.teams[d.league_season] || {}).length || 12;
  const slot = d.pick_no ? d.pick_no - (d.round - 1) * n : null;
  const p = D.players[d.player_id] || {};
  const pickTxt = slot > 0 ? `Pick ${d.round}.${String(slot).padStart(2, "0")}` : `Round ${d.round}`;
  const head = av(`https://sleepercdn.com/content/nfl/players/thumb/${d.player_id}.jpg`, pname(d.player_id));
  return `<div class="c"><span class="node" aria-hidden="true">${TICKET}</span></div>
    <div class="hero"><div class="hl">Draft selection · ${esc(fmt(d.time))}</div>
      <div class="big">${head}</div>
      <a class="hn" href="#player/${esc(d.player_id)}">${esc(pname(d.player_id))}</a>
      <div class="hs">${esc([p.pos, p.team].filter(Boolean).join(" · "))}</div>
      <div class="chips"><span>${esc(pickTxt)}</span><span>${esc(team(d.league_season, d.by))}</span></div>
      <div class="hs">Used the ${esc(pickLabel(key))}</div></div>`;
}

/* One chronology: pick origin -> pick trades -> draft -> player moves.
   Works from a pick (continues into the player it became) or a player (reaches back to the pick). */
function chain(key, pid) {
  let d = key ? D.draft_results[key] : null;
  if (d && !pid) pid = d.player_id;
  if (!key && pid) {
    const mine = Object.entries(D.draft_results).filter(([, x]) => x.player_id === pid).sort((a, b) => a[1].time - b[1].time);
    if (mine.length) { key = mine[0][0]; d = mine[0][1]; }
  }
  let html = "", holder = null, trades = 0;
  if (key) {
    const [s, r, o] = key.split("-");
    html += pill(`${s} ${ord(+r)} · started with ${team(s, o)}`);
    holder = team(s, o);
    const pre = [];
    for (const t of D.transactions) if (t.type === "trade") for (const p of t.picks)
      if (pickKey(p) === key) pre.push({time: t.created, html: tradeRow(t, p.from, p.to, a => a.kind === "pick" && a.key === key), holder: team(t.season, p.to)});
    pre.sort((a, b) => a.time - b.time);
    for (const e of pre) { html += e.html; holder = e.holder; trades++; }
    if (d) { html += draftHero(key, d); holder = team(d.league_season, d.by); }
  }
  if (pid) {
    const post = [];
    for (const [k, x] of Object.entries(D.draft_results))
      if (x.player_id === pid && k !== key)
        post.push({time: x.time, html: pill(`Drafted ${x.season} R${x.round} · ${team(x.league_season, x.by)}`, "", "#pick/" + k), holder: team(x.league_season, x.by)});
    for (const t of D.transactions) {
      const to = t.adds[pid], from = t.drops[pid];
      if (to == null && from == null) continue;
      if (t.type === "trade") post.push({time: t.created, trade: true, html: tradeRow(t, from, to, a => a.kind === "player" && a.id === pid), holder: team(t.season, to)});
      else if (to != null) post.push({time: t.created, html: pill(`${fmt(t.created)} · Added by ${team(t.season, to)} (${t.type.replace("_", " ")})`), holder: team(t.season, to)});
      else post.push({time: t.created, html: pill(`${fmt(t.created)} · Dropped by ${team(t.season, from)}`), holder: null});
    }
    post.sort((a, b) => a.time - b.time);
    for (const e of post) { html += e.html; holder = e.holder; if (e.trade) trades++; }
  }
  return {html, holder, trades};
}
const nowPill = c => pill(c.holder ? "Now: " + c.holder : "Not on a roster", "now");

function viewPlayer(pid) {
  const p = D.players[pid] || {name: pid}, c = chain(null, pid);
  $("#app").innerHTML = `<a href="#">← Home</a><h2>${esc(p.name)}</h2>
    <div class="sub">${esc([p.pos, p.team].filter(Boolean).join(" · "))}${p.pos || p.team ? " · " : ""}${c.trades} trade${c.trades === 1 ? "" : "s"} in this league${HAS ? " · " + pts1(ptsAll(pid, "0")) + " pts scored" : ""}</div>
    <div class="spine">${c.html}${nowPill(c)}</div>`;
}

function viewPick(key) {
  const [s, r, o] = key.split("-"), c = chain(key, null), d = D.draft_results[key];
  $("#app").innerHTML = `<a href="#">← Home</a><h2>${esc(s + " " + ord(+r) + "-round pick")}</h2>
    <div class="sub">Originally ${esc(team(s, o))} · ${c.trades} trade${c.trades === 1 ? "" : "s"}${d ? " · became " + esc(pname(d.player_id)) : ""}</div>
    <div class="spine">${c.html}${nowPill(c)}</div>`;
}

/* ---------- points (weekly points per player, while on a roster in this league) ---------- */
let P = {}, HAS = false;
function buildPoints() {
  for (const [k, m] of Object.entries(D.points || {})) {
    const [s, w, r] = k.split("-");
    for (const [pid, v] of Object.entries(m)) (P[pid] = P[pid] || []).push([s, +w, +r, v]);
  }
  HAS = Object.keys(D.points || {}).length > 0;
}
const ownerOf = (s, rid) => D.teams[s]?.[rid]?.owner_id ?? "r" + rid;
function buildMatchups() { MATCHUPS = D.matchups || []; }
const pts1 = v => v.toFixed(1);
const ptsSince = (pid, owner, season, week) => (P[pid] || []).reduce((a, [s, w, r, v]) =>
  a + ((s > season || (s === season && w >= week)) && ownerOf(s, r) === owner ? v : 0), 0);
const ptsAll = (pid, season) => (P[pid] || []).reduce((a, [s, , , v]) => a + (s >= season ? v : 0), 0);

/* ---------- trade scorecard ---------- */
function viewTrade(id) {
  const t = D.transactions.find(x => x.id === id);
  if (!t) return viewSearch();
  const rc = receipts(t);
  const ids = new Set([...Object.keys(rc), ...Object.values(t.drops).map(String), ...t.picks.map(p => String(p.from))]);
  const sides = [...ids].map(rid => {
    const owner = ownerOf(t.season, rid);
    let total = 0;
    const items = (rc[rid] || []).map(a => {
      let v = null;
      if (a.kind === "player") v = ptsSince(a.id, owner, t.season, t.week);
      else if (a.kind === "pick") {
        const d = D.draft_results[a.key];
        if (d && ownerOf(d.league_season, d.by) === owner) v = ptsSince(d.player_id, owner, d.season, 0);
      }
      if (v != null) total += v;
      return assetHtml(a, false, v != null && HAS ? pts1(v) : "");
    });
    return {rid, total, items, name: team(t.season, rid)};
  });
  const [a, b] = sides, two = sides.length === 2;
  const lead = two && a.total !== b.total ? (a.total > b.total ? a : b) : null;
  const sum = a.total + (b ? b.total : 0);

    ? `<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><div class="lbl">${esc(a.name)}</div><div class="tot">${pts1(a.total)}</div></div><div style="text-align:right"><div class="lbl">${esc(b.name)}</div><div class="tot">${pts1(b.total)}</div></div></div>

/* ---------- h2h ---------- */
function computeH2H(oa, ob) {
  let wa = 0, wb = 0, tie = 0, pfa = 0, pfb = 0;
  const games = [];
  for (const {s, w, p} of MATCHUPS) {
    if (p.length !== 2) continue;
    const [x, y] = p, xa = ownerOf(s, x.rid), xb = ownerOf(s, y.rid);
    let a, b;
    if (xa === oa && xb === ob) { a = x; b = y; }
    else if (xa === ob && xb === oa) { a = y; b = x; }
    else continue;
    pfa += a.pts; pfb += b.pts;
    if (a.pts > b.pts) wa++; else if (b.pts > a.pts) wb++; else tie++;
    games.push({s, w, apts: a.pts, bpts: b.pts});
  }
  return {wa, wb, tie, pfa, pfb, games: games.sort((x, y) => y.s.localeCompare(x.s) || y.w - x.w)};
}

/* ---------- records ---------- */
function leagueRecords() {
  let hi = null, lo = null, cl = null, bl = null;
  const str = {};
  const sorted = [...MATCHUPS].filter(x => x.p.length === 2 && x.p[0].pts > 0 && x.p[1].pts > 0).sort((a, b) => a.s.localeCompare(b.s) || a.w - b.w);
  for (const {s, w, p} of sorted) {
    const [a, b] = p, mg = Math.abs(a.pts - b.pts);
    for (const x of p) {
      if (!hi || x.pts > hi.pts) hi = {...x, s, w};
      if (!lo || x.pts < lo.pts) lo = {...x, s, w};
    }
    if (!cl || mg < Math.abs(cl.p[0].pts - cl.p[1].pts)) cl = {s, w, p};
    if (!bl || mg > Math.abs(bl.p[0].pts - bl.p[1].pts)) bl = {s, w, p};
    for (const x of p) {
      const oid = ownerOf(s, x.rid), opp = p.find(y => y !== x);
      if (!str[oid]) str[oid] = {w:0, l:0, mw:0, ml:0, wSt:null, lSt:null, mwSt:null, mwEn:null, mlSt:null, mlEn:null};
      const st = str[oid], won = x.pts > opp.pts;
      if (won) {
        st.w++; st.l = 0;
        if (st.w === 1) st.wSt = {s, w};
        if (st.w > st.mw) { st.mw = st.w; st.mwSt = st.wSt; st.mwEn = {s, w}; }
        st.lSt = null;
      } else {
        st.l++; st.w = 0;
        if (st.l === 1) st.lSt = {s, w};
        if (st.l > st.ml) { st.ml = st.l; st.mlSt = st.lSt; st.mlEn = {s, w}; }
        st.wSt = null;
      }
    }
  }
  const sa = Object.entries(str).map(([oid, v]) => ({oid, name: username(oid), ...v,
    winActive: v.w > 0 && v.w === v.mw,
    lossActive: v.l > 0 && v.l === v.ml,
  }));
  // Best regular season total
  let rsHi = null;
  const rsSeas = [...new Set(MATCHUPS.map(m => m.s))].sort();
  for (const s of rsSeas) {
    const pws = D.seasons?.[s]?.playoff_week_start || 15;
    const tot = {}, rec = {};
    for (const {w, p} of MATCHUPS.filter(m => m.s === s && m.p.length === 2)) {
      if (w >= pws) continue;
      for (const x of p) {
        const oid = ownerOf(s, x.rid), opp = p.find(y => y !== x);
        tot[oid] = (tot[oid] || 0) + x.pts;
        if (!rec[oid]) rec[oid] = {w: 0, l: 0};
        if (opp) { if (x.pts > opp.pts) rec[oid].w++; else rec[oid].l++; }
      }
    }
    for (const [oid, total] of Object.entries(tot)) {
      if (!rsHi || total > rsHi.total) rsHi = {total, oid, s, ...rec[oid]};
    }
  }
  return {hi, lo, cl, bl, win: [...sa].sort((a, b) => b.mw - a.mw)[0], loss: [...sa].sort((a, b) => b.ml - a.ml)[0], rsHi};
}

/* ---------- luck index ---------- */
function luckIndex() {
  // Pool all teams' scores for the same week so expected wins spans the full field
  const byWeek = {};
  for (const {s, w, p} of MATCHUPS)
    for (const x of p) (byWeek[`${s}-${w}`] = byWeek[`${s}-${w}`] || []).push({oid: ownerOf(s, x.rid), pts: x.pts});
  const exp = {}, act = {}, gms = {};
  for (const scores of Object.values(byWeek)) {
    const n = scores.length; if (n < 2) continue;
    for (const {oid, pts} of scores) {
      const oth = scores.filter(x => x.oid !== oid);
      exp[oid] = (exp[oid] || 0) + oth.reduce((a, x) => a + (x.pts < pts ? 1 : x.pts === pts ? 0.5 : 0), 0) / oth.length;
      gms[oid] = (gms[oid] || 0) + 1;
    }
  }
  for (const {s, p} of MATCHUPS) {
    if (p.length !== 2) continue;
    const [a, b] = p, oa = ownerOf(s, a.rid), ob = ownerOf(s, b.rid);
    act[oa] = (act[oa] || 0) + (a.pts > b.pts ? 1 : a.pts === b.pts ? 0.5 : 0);
    act[ob] = (act[ob] || 0) + (b.pts > a.pts ? 1 : a.pts === b.pts ? 0.5 : 0);
  }
  return Object.keys(exp).map(oid => ({oid, name: username(oid),
    exp: exp[oid], act: act[oid] || 0, gms: gms[oid] || 0, luck: (act[oid] || 0) - exp[oid]
  })).sort((a, b) => b.luck - a.luck);
}

/* ---------- rivalry engine ---------- */
function computeRivalryData(oa, ob) {
  let wa = 0, wb = 0, tie = 0, pfa = 0, pfb = 0;
  const chrono = [];
  for (const {s, w, p} of MATCHUPS) {
    if (p.length !== 2) continue;
    const [x, y] = p, xa = ownerOf(s, x.rid), xb = ownerOf(s, y.rid);
    let a, b;
    if (xa === oa && xb === ob) { a = x; b = y; }
    else if (xa === ob && xb === oa) { a = y; b = x; }
    else continue;
    if (a.pts === 0 && b.pts === 0) continue;
    pfa += a.pts; pfb += b.pts;
    if (a.pts > b.pts) wa++; else if (b.pts > a.pts) wb++; else tie++;
    chrono.push({s, w, apts: a.pts, bpts: b.pts});
  }
  chrono.sort((x, y) => x.s.localeCompare(y.s) || x.w - y.w);
  const tot = wa + wb + tie;
  const avgMargin = tot > 0 ? chrono.reduce((s, g) => s + Math.abs(g.apts - g.bpts), 0) / tot : 999;
  const rivalryScore = tot / (1 + avgMargin);
  // Consecutive loss streak for each owner at end of history
  let aStreak = 0, bStreak = 0;
  for (let i = chrono.length - 1; i >= 0; i--) {
    const g = chrono[i];
    if (aStreak === 0 && bStreak === 0) {
      if (g.apts < g.bpts) aStreak = 1;
      else if (g.bpts < g.apts) bStreak = 1;
      else break;
    } else if (aStreak > 0) { if (g.apts < g.bpts) aStreak++; else break; }
    else { if (g.bpts < g.apts) bStreak++; else break; }
  }
  // Biggest win and worst loss from oa's perspective
  let bigWin = null, bigLoss = null;
  for (const g of chrono) {
    const mg = g.apts - g.bpts;
    if (mg > 0 && (!bigWin  || mg >  bigWin.mg))  bigWin  = {...g, mg};
    if (mg < 0 && (!bigLoss || mg <  bigLoss.mg)) bigLoss = {...g, mg};
  }
  return {
    wa, wb, tie, pfa, pfb, tot,
    avgA: tot > 0 ? pfa / tot : 0, avgB: tot > 0 ? pfb / tot : 0,
    avgMargin, rivalryScore, aStreak, bStreak, bigWin, bigLoss,
    last5: [...chrono].reverse().slice(0, 5),
  };
}
function revengeScore(streak, winRate, tot) {
  if (tot < 1) return 0;
  return Math.min(Math.round(Math.min(streak * 20, 60) + (winRate < 0.5 ? Math.min((0.5 - winRate) * 80, 40) : 0)), 100);
}
function meterTier(score) {
  if (score >= 80) return "🚨 It's Personal";
  if (score >= 50) return "😤 Revenge Mode";
  if (score >= 20) return "🔍 Watching Closely";
  return "😌 Even Keel";
}
function rivalryTier(norm) {

  if (norm >= 40) return {emoji: "⚔️", label: "Contested"};
  if (norm >= 15) return {emoji: "👀", label: "Developing"};

}

    else if (leftSt === 1) streakTxt = `${esc(username(rightId))} won the last meeting`;

    else if (rightSt === 1) streakTxt = `${esc(username(leftId))} won the last meeting`;
    // Revenge meter
    const meter = revengeScore(leftSt, leftRate, r.tot);
    const avL = av(D.users?.[leftId]?.avatar  ? `https://sleepercdn.com/avatars/thumbs/${D.users[leftId].avatar}`  : null, username(leftId));
    const avR = av(D.users?.[rightId]?.avatar ? `https://sleepercdn.com/avatars/thumbs/${D.users[rightId].avatar}` : null, username(rightId));

        <div class="rv-mgr">${avR}<div class="rv-mgr-name">${esc(username(rightId))}</div></div>
      </div>
      <div class="rv-sec rv-rec"><span class="rv-rec-lead">${recTxt}</span>${streakTxt ? `<span class="rv-streak">${streakTxt}</span>` : ""}</div>
      ${r.last5.length ? `<div class="rv-sec"><div class="mut" style="font-size:.7rem;margin-bottom:5px">Last ${r.last5.length} matchups</div>${last5Html}</div>` : ""}
      <div class="rv-sec">
        <div class="rv-meter-lbl"><span>${esc(meterTier(meter))}</span>${meter > 0 ? `<small>${esc(username(leftId))}</small>` : ""}</div>
        <div class="rv-meter"><div class="rv-meter-fill" style="width:${meter}%"></div></div>
      </div>
      ${(() => { const rBW = leftBigLoss ? {mg: Math.abs(leftBigLoss.mg), s: leftBigLoss.s, w: leftBigLoss.w} : null;
        return (leftBigWin || rBW) ? `<div class="rv-sec rv-moments">
          <div class="mut" style="font-size:.7rem;margin-bottom:4px">Biggest Wins in Rivalry</div>
          ${leftBigWin ? `<div>${esc(username(leftId))} won by <b>${leftBigWin.mg.toFixed(1)}</b> \u00b7 Week ${leftBigWin.w}, ${leftBigWin.s}</div>` : ""}
          ${rBW        ? `<div>${esc(username(rightId))} won by <b>${rBW.mg.toFixed(1)}</b> \u00b7 Week ${rBW.w}, ${rBW.s}</div>` : ""}
        </div>` : ""; })()}
      ${r.tot > 0 ? `<div class="rv-sec rv-avg">${esc(username(leftId))} avg <b>${pts1(leftAvg)}</b> &nbsp;\u00b7&nbsp; ${esc(username(rightId))} avg <b>${pts1(rightAvg)}</b></div>` : ""}
    </div>`;
  }).join("");
  $("#app").innerHTML = `<h2>Rivalry Engine</h2>
    <div class="sub">Week ${curWeek} \u00b7 ${curSeason} \u2014 the history behind every matchup</div>
    <div class="rv-grid">${cards}</div>`;
}

/* ---------- dynasty timeline ---------- */
function tlTs(season, week) {
  return new Date(+season, 8, 1 + (week - 1) * 7).getTime();
}
function tradeParties(t) {
  const s = new Set([
    ...Object.values(t.adds || {}),
    ...(t.picks || []).flatMap(p => [p.to, p.from].filter(Boolean))
  ]);
  return [...s].filter(Boolean).slice(0, 2);
}
function sideAssets(t, rid) {
  const pids = Object.entries(t.adds || {}).filter(([, r]) => String(r) === String(rid)).map(([p]) => p);
  const picks = (t.picks || []).filter(p => String(p.to) === String(rid));
  return {pids, picks};
}
function fmtAssets(pids, picks) {
  const parts = [
    ...pids.slice(0, 3).map(pid => esc(D.players[pid]?.name || "Unknown")),
    ...picks.slice(0, 3).map(p => esc(`${p.season} Round ${p.round}`)),
  ];
  const extra = pids.length + picks.length - parts.length;
  if (extra > 0) parts.push(`+${extra} more`);
  return parts.join(", ") || "\u2014";
}
function tradeLabel(t, topName) {
  const r1 = (t.picks||[]).filter(p => p.round === 1).length;
  const pCount = Object.keys(t.adds||{}).length;
  const pkCount = (t.picks||[]).length;
  const n = topName ? esc(topName) : null;
  if (n && r1 >= 2) return `${n} + ${r1} first-round pick${r1!==1?"s":""}`;
  if (r1 >= 2)      return `${r1} first-round picks exchanged`;
  if (n && r1 >= 1) return `${n} + a 1st-round pick`;
  if (n && pCount >= 2) return `${n} headlines the deal`;
  if (n)            return `${n} on the move`;
  if (r1 === 1 && pCount >= 2) return "Package deal \u00b7 1st-round pick included";
  if (r1 === 1)     return "1st-round pick included";
  if (pCount >= 4)  return `${pCount}-player blockbuster`;
  if (pkCount >= 3) return `${pkCount}-pick package`;
  return `${pCount} player${pCount!==1?"s":""} \u00b7 ${pkCount} pick${pkCount!==1?"s":""}`;
}
function champData(s) {
  // Returns {game, winnerOid, loserOid, inferred?} for the championship of season s.
  // Priority: 1) D.champions bracket data  2) undefeated-team heuristic  3) highest combined score
  const pws = D.seasons?.[s]?.playoff_week_start || 15;
  const pg = MATCHUPS.filter(m=>m.s===s&&m.w>=pws&&m.p.length===2&&m.p.every(x=>x.pts>0))
    .sort((a,b)=>b.w-a.w);
  if (!pg.length) return null;
  const lastW = pg[0].w, finals = pg.filter(m=>m.w===lastW);
  if (!finals.length) return null;
  // 1 · Authoritative bracket data
  const cr = D.champions?.[s]?.roster_id;
  if (cr) {
    const co = ownerOf(s, cr);
    const game = finals.find(m=>m.p.some(x=>ownerOf(s,x.rid)===co));
    if (game) {
      const ru = D.champions[s].runner_up, loserP = game.p.find(x=>ownerOf(s,x.rid)!==co);
      return {game, winnerOid:co, loserOid:ru ? ownerOf(s,ru) : ownerOf(s, loserP?.rid||"")};
    }
  }
  // 2 · Teams undefeated through earlier playoff rounds = championship participants
  const rec = {};
  for (const m of pg.filter(m=>m.w<lastW)) {
    for (const x of m.p) {
      const oid=ownerOf(s,x.rid); if (!rec[oid]) rec[oid]={w:0,l:0};
      const opp=m.p.find(y=>y!==x); if (x.pts>opp.pts) rec[oid].w++; else rec[oid].l++;
    }
  }
  const undefeated = Object.entries(rec).filter(([,r])=>r.l===0).map(e=>e[0]);
  const sfGame = undefeated.length>=2
    ? finals.find(m=>undefeated.slice(0,2).every(t=>m.p.some(x=>ownerOf(s,x.rid)===t))) : null;
  // 3 · Last resort: highest combined score in final week
  const g = sfGame || [...finals].sort((a,b)=>(b.p[0].pts+b.p[1].pts)-(a.p[0].pts+a.p[1].pts))[0];
  if (!g) return null;
  const winner=g.p[0].pts>=g.p[1].pts?g.p[0]:g.p[1], loser=g.p[0].pts<g.p[1].pts?g.p[0]:g.p[1];
  return {game:g, winnerOid:ownerOf(s,winner.rid), loserOid:ownerOf(s,loser.rid), inferred:true};
}
function buildTimeline() {
  const evs = [];
  const seasons = [...new Set([...Object.keys(D.teams || {}), ...Object.keys(D.champions || {})])].sort();
  // 1 · Season banners
  for (const s of seasons) {
    const teamCount = Object.keys(D.teams[s] || {}).length;
    evs.push({type:"season", season:s, ts:new Date(+s,7,1).getTime(), full:true, data:{teamCount}});
  }
  // 2 · Draft events (one per league_season)
  const draftBySeason = {};
  for (const [, pick] of Object.entries(D.draft_results)) {
    const s = pick.league_season;
    if (!draftBySeason[s]) draftBySeason[s] = {picks:[], ts:pick.time || new Date(+s,8,15).getTime()};
    if (pick.round === 1) draftBySeason[s].picks.push(pick);
    if (pick.time && pick.time < draftBySeason[s].ts) draftBySeason[s].ts = pick.time;
  }
  for (const [s, {picks, ts}] of Object.entries(draftBySeason)) {
    const r1 = picks.sort((a, b) => (a.pick_no||0)-(b.pick_no||0)).slice(0, 3);
    evs.push({type:"draft", season:s, ts, full:false, data:{picks:r1}});
  }
  // 3 · Champions — uses bracket data when available, infers from matchups otherwise
  for (const s of seasons) {
    const cd = champData(s);
    if (!cd?.winnerOid) continue;
    const pws = D.seasons?.[s]?.playoff_week_start || 15;
    let cw = 0, cl = 0;
    for (const m of MATCHUPS.filter(m => m.s === s && m.w < pws && m.p.length === 2)) {
      const side = m.p.find(x => ownerOf(s, x.rid) === cd.winnerOid);
      const opp  = m.p.find(x => ownerOf(s, x.rid) !== cd.winnerOid);
      if (side && opp) { if (side.pts > opp.pts) cw++; else cl++; }
    }
    evs.push({type:"champion", season:s, ts:new Date(+s,11,25).getTime(), full:true,
      data:{champOid:cd.winnerOid, ruOid:cd.loserOid, record:`${cw}\u2013${cl}`}});
  }
  // 4 · Records — emit threshold milestones + always include the current all-time record
  const scoreThresh = [150, 175, 200, 225, 250];
  const blowThresh  = [25, 50, 75, 100];
  const rsTotThresh = [1500, 1700, 1900, 2000];
  const sCrossed = new Set(), bCrossed = new Set();
  let hiScore = 0, hiScoreDat = null, hiBlowout = 0, hiBlowoutDat = null;
  const sortedM = [...MATCHUPS].filter(m => m.p.length===2 && m.p[0].pts>0 && m.p[1].pts>0)
    .sort((a,b) => a.s.localeCompare(b.s)||a.w-b.w);
  for (const m of sortedM) {
    const ts = tlTs(m.s, m.w);
    for (const side of m.p) {
      if (side.pts > hiScore) { hiScore = side.pts; hiScoreDat = {pts:side.pts, oid:ownerOf(m.s,side.rid), s:m.s, w:m.w, ts}; }
      for (const th of scoreThresh) {
        if (side.pts >= th && !sCrossed.has(th)) {
          sCrossed.add(th);
          evs.push({type:"record", season:m.s, week:m.w, ts, full:false,
            data:{recordType:"hi_score", pts:side.pts, oid:ownerOf(m.s,side.rid), s:m.s, w:m.w, label:`First ${th}+ point game in league history`}});
        }
      }
    }
    const mg = Math.abs(m.p[0].pts - m.p[1].pts);
    if (mg > hiBlowout) {
      const win = m.p[0].pts > m.p[1].pts ? m.p[0] : m.p[1], los = m.p[0].pts < m.p[1].pts ? m.p[0] : m.p[1];
      hiBlowout = mg; hiBlowoutDat = {margin:mg, wOid:ownerOf(m.s,win.rid), lOid:ownerOf(m.s,los.rid), wPts:win.pts, lPts:los.pts, s:m.s, w:m.w, ts};
    }
    for (const th of blowThresh) {
      if (mg >= th && !bCrossed.has(th)) {
        bCrossed.add(th);
        const win = m.p[0].pts > m.p[1].pts ? m.p[0] : m.p[1], los = m.p[0].pts < m.p[1].pts ? m.p[0] : m.p[1];
        evs.push({type:"record", season:m.s, week:m.w, ts, full:false,
          data:{recordType:"blowout", margin:mg, wOid:ownerOf(m.s,win.rid), lOid:ownerOf(m.s,los.rid), wPts:win.pts, lPts:los.pts, s:m.s, w:m.w, label:`First ${th}+ point blowout in league history`}});
      }
    }
  }
  // Always include the current all-time records if not already covered by a threshold event
  const covered = (dat, type, field) => dat && evs.some(e => e.type==="record" && e.data?.recordType===type && e.data?.s===dat.s && e.data?.w===dat.w && e.data?.[field]===dat[field]);
  if (hiScoreDat && !covered(hiScoreDat, "hi_score", "oid"))
    evs.push({type:"record", season:hiScoreDat.s, week:hiScoreDat.w, ts:hiScoreDat.ts, full:false,
      data:{recordType:"hi_score", pts:hiScoreDat.pts, oid:hiScoreDat.oid, s:hiScoreDat.s, w:hiScoreDat.w, label:"All-time high score"}});
  if (hiBlowoutDat && !covered(hiBlowoutDat, "blowout", "wOid"))
    evs.push({type:"record", season:hiBlowoutDat.s, week:hiBlowoutDat.w, ts:hiBlowoutDat.ts, full:false,
      data:{...hiBlowoutDat, recordType:"blowout", label:"All-time record blowout"}});
  // RS total thresholds + current record
  const rsCrossed = new Set(); let hiRSTotal = 0, hiRSTotalDat = null;
  for (const s of seasons) {
    const pws = D.seasons?.[s]?.playoff_week_start || 15;
    const tot = {};
    for (const m of MATCHUPS.filter(m => m.s===s && m.w<pws && m.p.length===2))
      for (const x of m.p) { const oid=ownerOf(s,x.rid); tot[oid]=(tot[oid]||0)+x.pts; }
    const lastW = Math.max(0,...MATCHUPS.filter(m=>m.s===s&&m.w<pws).map(m=>m.w));
    if (!lastW) continue;
    const ts = tlTs(s, lastW);
    for (const [oid, total] of Object.entries(tot)) {
      for (const th of rsTotThresh) {
        if (total >= th && !rsCrossed.has(th)) {
          rsCrossed.add(th);
          evs.push({type:"record", season:s, week:lastW, ts, full:false,
            data:{recordType:"rs_total", total, oid, s, w:lastW, label:`First ${th.toLocaleString()}+ point regular season`}});
        }
      }
      if (total > hiRSTotal) { hiRSTotal = total; hiRSTotalDat = {total, oid, s, w:lastW, ts}; }
    }
  }
  if (hiRSTotalDat && !evs.some(e => e.type==="record" && e.data?.recordType==="rs_total" && e.data?.s===hiRSTotalDat.s && e.data?.oid===hiRSTotalDat.oid))
    evs.push({type:"record", season:hiRSTotalDat.s, week:hiRSTotalDat.w, ts:hiRSTotalDat.ts, full:false,
      data:{recordType:"rs_total", total:hiRSTotalDat.total, oid:hiRSTotalDat.oid, s:hiRSTotalDat.s, w:hiRSTotalDat.w, label:"All-time regular season total"}});
  // Career pts cache — sums every player's points across all weeks/seasons
  const ptsCache = {};
  for (const weekData of Object.values(D.points)) {
    for (const [pid, pts] of Object.entries(weekData)) {
      ptsCache[pid] = (ptsCache[pid] || 0) + pts;
    }
  }
  // 5 · Top trades per season — scored by player career pts + pick tier value
  const tradeBySeason = {};
  for (const t of D.transactions.filter(t => t.type==="trade")) {
    const playerScore = Object.keys(t.adds||{}).reduce((s, pid) => s + (ptsCache[pid]||0), 0);
    const pickScore   = (t.picks||[]).reduce((s, p) =>
      s + (p.round===1?400:p.round===2?200:p.round===3?100:50), 0);
    const sc = playerScore + pickScore;
    if (sc < 350) continue;  // skip low-value trades
    // Find the most valuable player in the trade by career pts
    let topPid = null, topPts = 0;
    for (const pid of Object.keys(t.adds||{})) {
      if ((ptsCache[pid]||0) > topPts) { topPts = ptsCache[pid]||0; topPid = pid; }
    }
    const topName = topPid ? (D.players[topPid]?.name || null) : null;
    if (!tradeBySeason[t.season]) tradeBySeason[t.season] = [];
    tradeBySeason[t.season].push({...t, sc, topName});
  }
  for (const [, trades] of Object.entries(tradeBySeason)) {
    for (const t of [...trades].sort((a,b)=>b.sc-a.sc).slice(0,3))
      evs.push({type:"trade", season:t.season, week:t.week, ts:t.created, full:true,
        data:{t, topName:t.topName}});
  }
  // 6 · Top matchups per season + championship
  for (const s of seasons) {
    const pws = D.seasons?.[s]?.playoff_week_start || 15;
    const reg = MATCHUPS.filter(m=>m.s===s&&m.w<pws&&m.p.length===2&&m.p.every(x=>x.pts>0));
    if (reg.length) {
      const topScore = [...reg].sort((a,b)=>Math.max(b.p[0].pts,b.p[1].pts)-Math.max(a.p[0].pts,a.p[1].pts))[0];
      const closest = [...reg].sort((a,b)=>Math.abs(a.p[0].pts-a.p[1].pts)-Math.abs(b.p[0].pts-b.p[1].pts))[0];
      const added = new Set();
      for (const [game, label] of [[topScore,"top_score"],[closest,"closest"]]) {
        if (!game||added.has(game.w)) continue;
        added.add(game.w);
        evs.push({type:"matchup", season:s, week:game.w, ts:tlTs(s,game.w), full:false,
          data:{game, label, isChamp:false}});
      }
    }
    const cd = champData(s);
    if (cd?.game)
      evs.push({type:"matchup", season:s, week:cd.game.w, ts:tlTs(s,cd.game.w), full:false,
        data:{game:cd.game, label:"champ", isChamp:true}});
  }
  return evs.sort((a,b)=>a.ts-b.ts);
}

function renderTlEvents(filter) {

    if (filter!=="all" && ev.type!=="season") {
      const isChampGame = ev.type==="matchup" && ev.data?.isChamp;
      if (filter==="matchups"  && isChampGame) return "";           // champ game → Champions only
      if (filter==="champions" && isChampGame) { /* allow through */ }
      else {
        const map={draft:"drafts",trade:"trades",record:"records",matchup:"matchups",champion:"champions"};
        if (map[ev.type]!==filter) return "";
      }
    }
    const isCard = !ev.full;

    if (isCard) cardIdx++;
    return tlCard(ev, idx);
  }).join("");
}

function prophecyState() {
  const {season, week} = D.current || {};
  if (!season || !week) return "offseason";
  const wm = MATCHUPS.filter(m => m.s===season && m.w===week && m.p.length===2);
  if (!wm.length) return "open";
  if (!wm.some(m => m.p.some(x => x.pts>0))) return "open";
  return wm.every(m => m.p.every(x => x.pts>0)) ? "results" : "locked";
}
const pbIdentity = () => localStorage.getItem("pb-identity");
const pbSetIdentity = oid => localStorage.setItem("pb-identity", oid);
function managerSeasonAvg(oid, season) {
  const pws = D.seasons?.[season]?.playoff_week_start || 15;
  let tot = 0, n = 0;
  for (const m of MATCHUPS.filter(m => m.s===season && m.w<pws && m.p.length===2)) {
    const s = m.p.find(x => ownerOf(season,x.rid)===oid);
    if (s?.pts > 0) { tot += s.pts; n++; }
  }
  return n > 2 ? Math.round(tot/n*10)/10 : null;
}
function findActualScore(oid, season, week) {
  const w = parseInt(week);
  for (const m of MATCHUPS) {
    if (m.s!==String(season)||m.w!==w||m.p.length!==2) continue;
    const s = m.p.find(x => ownerOf(String(season),x.rid)===oid);
    if (s?.pts>0) return s.pts;
  }
  return null;
}

  if (!DB) return [];
  try { const sn=await DB.collection("predictions").where("season","==",String(season)).get(); return sn.docs.map(d=>d.data()); }

async function pbWrite(oid, teamName, predicted, season, week) {
  await DB.collection("predictions").doc(`${season}-${week}-${oid}`).set(
    {owner_id:oid,team_name:String(teamName),predicted:parseFloat(predicted),
     season:String(season),week:parseInt(week),submitted:Date.now()});
}
function computeLeaderboard(predictions) {
  const stats = {};
  for (const p of predictions) {
    const actual = findActualScore(p.owner_id, p.season, p.week);
    if (actual===null) continue;
    const err = Math.abs(p.predicted-actual);
    if (!stats[p.owner_id]) stats[p.owner_id]={oid:p.owner_id,errs:[],total:0,count:0};
    const s=stats[p.owner_id]; s.errs.push({err,week:p.week,season:p.season,predicted:p.predicted,actual}); s.total+=err; s.count++;
  }
  return Object.values(stats).map(s=>({...s,avg:s.total/s.count,
    best:s.errs.reduce((m,e)=>e.err<m.err?e:m,{err:Infinity})})).sort((a,b)=>a.avg-b.avg);
}
function accuracyTier(avg) {
  if (avg<5)  return {emoji:"🔮",label:"Oracle"};
  if (avg<10) return {emoji:"🎯",label:"Sharp"};
  if (avg<15) return {emoji:"📊",label:"Analyst"};
  return             {emoji:"🎲",label:"Guessing"};
}

    Object.keys(t.adds).forEach(p => pids.add(p));
    Object.keys(t.drops).forEach(p => pids.add(p));
    t.picks.forEach(p => keys.add(pickKey(p)));
  }
  for (const [k, d] of Object.entries(D.draft_results)) { pids.add(d.player_id); keys.add(k); }
  for (const pid of pids) {
    const p = D.players[pid] || {name: pid}, tag = [p.pos, p.team].filter(Boolean).join(" · ");
    ITEMS.push({type: "player", id: pid, label: p.name, tag, icon: headshot(pid), hay: (p.name + " " + tag).toLowerCase()});
  }
  [...keys].sort().reverse().forEach(k => {
    const [, r] = k.split("-"), label = pickLabel(k);
    ITEMS.push({type: "pick", id: k, label, tag: D.draft_results[k] ? "Became " + pname(D.draft_results[k].player_id) : "Pick",
      icon: `<span class="av sq">${TICKET}</span>`, hay: (label + " " + ord(+r) + " round " + r).toLowerCase()});
  });
}

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

fetch("history.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    D = data; buildPoints(); buildMatchups(); buildItems();
    $("#foot").textContent = "Data updated " + fmt(Date.parse(D.generated));
    addEventListener("hashchange", route); route();
    loadProphetBadge();
  })
  .catch(() => { $("#app").innerHTML = `<p class="hint">Couldn’t load history.json. Run crawl.py first, and serve this folder over http (not file://).</p>`; });
</script>
</body>
</html>
