<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f3f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05091d" media="(prefers-color-scheme: dark)">
<title>League Asset History</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="League History">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f1f3f9;--card:#fff;--bd:#d5d9e8;--fg:#05091d;--mut:#4a5170;--ac:#2f5bec;--tag:#e3e6f0;--hit:#e2e8ff;--line:#9aa3bf}
@media (prefers-color-scheme:dark){:root{--bg:#05091d;--card:#0e1430;--bd:#232b52;--fg:#eef1ff;--mut:#a3acd6;--ac:#6c93ff;--tag:#1b2350;--hit:#16224f;--line:#3a4580}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 12px;letter-spacing:-.01em}
h2{font-size:1.5rem;margin:6px 0 0;letter-spacing:-.01em}
a{color:var(--ac);text-decoration:none;font-weight:600}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hint,.sub{color:var(--mut);font-size:.85rem;margin:2px 0 14px}
.results{list-style:none;margin:12px 0 0;padding:0}
.res{display:flex;gap:10px;align-items:center;min-height:48px;padding:8px 10px;margin-bottom:6px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font-weight:500;overflow:hidden}
.res small{display:block;color:var(--mut);font-weight:400;font-size:.78rem}
.av{position:relative;overflow:hidden;width:28px;height:28px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--tag);color:var(--fg)}
.av.sq{border-radius:7px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--tag)}
.spine{position:relative;margin-top:6px}
.spine::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.c{text-align:center;position:relative}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--fg)}
.pill.now{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gap{height:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 14px;position:relative}
.side{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;min-width:0}
.th{display:flex;gap:7px;align-items:center;margin-bottom:2px}
.team{font-size:.78rem;font-weight:700;line-height:1.2}.lbl{font-size:.7rem;color:var(--mut)}
.asset{display:flex;gap:7px;align-items:center;padding:7px;margin-top:6px;border-radius:8px;background:var(--bg);color:var(--fg);font-size:.82rem;font-weight:500;min-height:44px}
.asset .nm{min-width:0}.asset small{display:block;font-size:.7rem;color:var(--mut);font-weight:400}
.asset small.bec{color:var(--ac);font-weight:600}
.hit{background:var(--hit);outline:2px solid var(--ac)}
.none{font-size:.75rem;color:var(--mut);padding:8px 2px}
.badge{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center}
.node{display:inline-flex;width:32px;height:32px;border-radius:9px;background:var(--ac);color:var(--bg);align-items:center;justify-content:center}
.hero{background:var(--fg);color:var(--bg);border-radius:16px;padding:16px;text-align:center;margin:8px 0 14px;position:relative}
.hero a{color:var(--bg)}
.hero .hl{font-size:.78rem;font-weight:600;opacity:.85}
.hero .big{display:flex;justify-content:center;margin:12px 0 8px}
.hero .big .av{width:64px;height:64px;font-size:18px;background:var(--ac);color:var(--bg)}
.hero .hn{font-size:1.25rem;font-weight:700}
.hero .hs{font-size:.8rem;opacity:.85}
.hero .chips{display:flex;justify-content:center;gap:8px;margin:12px 0}
.hero .chips span{padding:5px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--bg) 18%,transparent)}
.chips{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto}
.chip{flex:none;padding:7px 12px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.card2{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.ttl{font-weight:700;font-size:.85rem;margin-bottom:6px}
.dr{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);color:var(--fg);font-weight:500;font-size:.85rem}
.dr .no{width:34px;font-size:.75rem;font-weight:700;color:var(--mut)}
.dr .nm{flex:1;min-width:0}.dr small{display:block;font-size:.72rem;color:var(--mut);font-weight:400}
.dr .rt{text-align:right;font-size:.75rem;flex:none;max-width:40%}.dr .rt small{color:var(--ac);font-weight:600}
.pbw{overflow-x:auto}
.pb{display:grid;grid-template-columns:minmax(120px,1.6fr) repeat(var(--r),minmax(46px,1fr));align-items:center;text-align:center;border-top:1px solid var(--bd);padding:7px 0;font-size:.78rem}
.pb.h{border:0;color:var(--mut);font-size:.7rem}
.pb .tn{display:flex;gap:6px;align-items:center;text-align:left;font-weight:600;min-width:0}
.pb .tn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut)}
.chipt{display:inline-block;background:var(--ac);color:var(--bg);border-radius:6px;padding:3px 7px;margin:1px;font-size:.7rem;font-weight:700}
.pt{margin-left:auto;font-size:.8rem;padding-left:6px}
.tot{font-size:1.75rem;font-weight:700}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0;background:var(--tag)}
.bar i{background:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ppts{background:rgba(16,185,129,.15);color:#34d399;padding:2px 8px;border-radius:12px;font-weight:600;font-size:.75rem;white-space:nowrap;display:inline-block;margin-top:3px}
.ow{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;display:inline-block;vertical-align:bottom}
.ow.exp{max-width:none;white-space:normal;word-break:break-word}
.pln{color:var(--fg);font-weight:600;text-decoration:none;flex:1;min-width:0}
.rr{padding:10px 0;border-top:1px solid var(--bd);font-size:.82rem;display:flex;gap:10px;align-items:center}
.rr b{min-width:52px;font-size:1rem}.rr .ri{flex:1;min-width:0;color:var(--mut)}
.lrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:.82rem}
.lp{font-weight:700;font-size:.88rem;min-width:44px;text-align:right}
.lpos{color:#34d399}.lneg{color:#f87171}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--bd);font-size:.82rem}
.pi{display:block;line-height:1.15;margin:3px 0}
.pp{display:block;font-size:.65rem;color:var(--mut)}
/* ─── Responsive ─────────────────────────────────────────── */
#nav{scrollbar-width:none;-webkit-overflow-scrolling:touch}
#nav::-webkit-scrollbar{display:none}
.unm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
@media(max-width:360px){
  main{padding:12px}
  h2{font-size:1.3rem}
  .chip{padding:5px 9px;font-size:.74rem}
  .row{gap:8px;margin:6px 0 10px}
  .side{padding:6px}
  .asset{padding:5px;gap:5px;font-size:.78rem;min-height:40px}
  .dr .no{width:26px}
  .ow{max-width:76px}
  .badge{width:22px;height:22px;margin:-11px}
}
@media(max-width:480px){
  .row{gap:10px}
  .side{padding:7px}
  .ow{max-width:108px}
  .pill{max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unm{max-width:72px}
}
@media(min-width:600px){
  main{max-width:600px}
}
@media(min-width:768px){
  main{max-width:740px;padding:24px 32px}
  h1{font-size:1.6rem}
  h2{font-size:1.75rem}
  .row{gap:18px}
  .side{padding:12px}
  .asset{padding:9px;font-size:.9rem}
  .ow{max-width:180px}
  .dr{font-size:.9rem}
  .chip{padding:8px 14px}
  .card2{padding:16px}
}
@media(min-width:1024px){
  main{max-width:900px;padding:32px 40px}
  h1{font-size:1.8rem}
  h2{font-size:1.9rem}
}
/* ─── PWA install modal ───────────────────────────────────── */
#pwa-modal:not([hidden]){position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;box-sizing:border-box}
.pwa-card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.pwa-ico{width:80px;height:80px;border-radius:18px;margin:0 auto 14px;display:block;object-fit:cover}
.pwa-h{font-size:1.1rem;font-weight:700;margin:0 0 6px;line-height:1.3}
.pwa-sub{font-size:.82rem;color:var(--mut);margin:0 0 14px;line-height:1.45}
.pwa-steps{background:var(--bg);border-radius:10px;padding:11px 13px;font-size:.8rem;text-align:left;margin-bottom:16px;line-height:1.6;color:var(--fg)}
.pwa-btns{display:flex;flex-direction:column;gap:10px}
.pwa-btn-main{padding:14px;border-radius:11px;border:0;background:linear-gradient(135deg,#c9941a,#f0c040);color:#05091d;font:700 .9rem Inter,system-ui,sans-serif;cursor:pointer;letter-spacing:.01em}
.pwa-btn-sec{padding:12px;border-radius:11px;border:1px solid var(--bd);background:transparent;color:var(--mut);font:600 .88rem Inter,system-ui,sans-serif;cursor:pointer}
#pwa-tip:not([hidden]){position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.8rem;text-align:center;max-width:270px;width:max-content;box-shadow:0 4px 24px rgba(0,0,0,.5);z-index:9998;display:block;animation:fadeUp .25s ease}
#pwa-tip::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--fg);border-bottom:0}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
footer{margin-top:28px;font-size:.78rem;color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>League Asset History</h1>
  <nav id="nav" class="chips"></nav>
  <div id="app"><p class="hint">Loading…</p></div>
  <footer id="foot"></footer>

  <div id="pwa-modal" hidden role="dialog" aria-modal="true" aria-label="Install app">
    <div class="pwa-card">
      <img src="icons/apple-touch-icon.png" alt="Big Boy Dynasty League" class="pwa-ico">
      <h3 class="pwa-h">Welcome to the<br>Big Boy Dynasty League</h3>
      <p class="pwa-sub">Your dynasty hub — built to complement your league on Sleeper.</p>
      <div id="pwa-steps" class="pwa-steps"></div>
      <div class="pwa-btns">
        <button id="pwa-action" class="pwa-btn-main"></button>
        <button id="pwa-later" class="pwa-btn-sec">Maybe Later</button>
      </div>
    </div>
  </div>
  <div id="pwa-tip" hidden aria-live="polite"></div>
</main>
<script>
/* ── PWA install prompt ──────────────────────────────────── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
(function initPWA() {
  if (window.matchMedia('(display-mode:standalone)').matches || navigator.standalone) return;
  try { if (localStorage.getItem('pwa-dismissed')) return; } catch (_) {}
  const ua = navigator.userAgent;
  if (!/Android|iPhone|iPad|iPod/.test(ua)) return; // desktop: skip
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const modal = document.getElementById('pwa-modal');
  const steps = document.getElementById('pwa-steps');
  const action = document.getElementById('pwa-action');
  const later  = document.getElementById('pwa-later');
  const tip    = document.getElementById('pwa-tip');
  if (isIOS) {
    steps.innerHTML = 'Open this link in <strong>Safari</strong>. Tap the <strong>Share ↑</strong> button at the bottom of the screen, then tap <strong>Add to Home Screen</strong>.<br><small style="color:var(--mut)">Chrome and other iOS browsers cannot install apps.</small>';
    action.textContent = 'Show me how';
    action.onclick = () => {
      modal.hidden = true;
      tip.innerHTML = 'Tap <strong>Share ↑</strong> below, then <strong>Add to Home Screen</strong>';
      tip.hidden = false;
      setTimeout(() => { tip.hidden = true; }, 9000);
    };
  } else {
    steps.innerHTML = 'Tap the browser menu <strong>⋮</strong> and look for <strong>Add to Home Screen</strong> or <strong>Install App</strong>.';
    action.textContent = 'Install App';
    action.onclick = async () => {
      if (deferredPrompt) {
        await deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') {
          try { localStorage.setItem('pwa-dismissed','1'); } catch (_) {}
          modal.hidden = true;
        }
      } else {
        modal.hidden = true;
        tip.innerHTML = 'Tap <strong>⋮</strong> in your browser, then <strong>Add to Home Screen</strong>';
        tip.hidden = false;
        setTimeout(() => { tip.hidden = true; }, 9000);
      }
    };
  }
  later.onclick = () => {
    try { localStorage.setItem('pwa-dismissed','1'); } catch (_) {}
    modal.hidden = true;
  };
  modal.hidden = false;
})();


const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ord = n => ({1:"1st",2:"2nd",3:"3rd"}[n] || n + "th");
const fmt = ms => ms ? new Date(ms).toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"}) : "";
const ARROW = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>`;
const TICKET = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/></svg>`;
let D, ITEMS = [], MATCHUPS = [];

/* ---------- lookups ---------- */
function teamObj(season, rid) {
  const t = D.teams[season]?.[rid];
  if (t) return t;
  for (const s of Object.keys(D.teams).sort().reverse()) if (D.teams[s][rid]) return D.teams[s][rid];
  return {name: "Team " + rid};
}
const team = (s, rid) => teamObj(s, rid).name;
const pname = pid => D.players[pid]?.name || pid;
const pickKey = p => `${p.season}-${p.round}-${p.roster_id}`;
const pickLabel = k => { const [s, r, o] = k.split("-"); return `${s} ${ord(+r)}-round pick (orig. ${teamUsername(s, o)})`; };

/* ---------- faces (image over initials; a failed image just disappears) ---------- */
const ini = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const av = (src, name, sq) => `<span class="av${sq ? " sq" : ""}">${esc(ini(name))}${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
const headshot = pid => av(`https://sleepercdn.com/content/nfl/players/thumb/${pid}.jpg`, pname(pid));
const teamAv = (s, rid) => { const t = teamObj(s, rid); return av(t.avatar ? `https://sleepercdn.com/avatars/thumbs/${t.avatar}` : null, t.name); };

const username = oid => D.users?.[oid]?.name || oid;
const teamUsername = (ss, rid) => { const t = teamObj(ss, rid); return t?.owner_id ? username(t.owner_id) : t?.name || "Team " + rid; };
const uav = oid => av(D.users?.[oid]?.avatar ? `https://sleepercdn.com/avatars/thumbs/${D.users[oid].avatar}` : null, username(oid));
function getOwners() {
  const seen = new Set();
  return Object.values(D.teams).flatMap(ss => Object.values(ss)).map(t => t.owner_id).filter(x => x && !seen.has(x) && seen.add(x));
}
function assetHtml(a, hit, val = "") {
  let icon, name, sub = "", href = "", extra = "";
  if (a.kind === "player") {
    const p = D.players[a.id] || {};
    icon = headshot(a.id); name = pname(a.id); sub = [p.pos, p.team].filter(Boolean).join(" · "); href = "#player/" + a.id;
  } else if (a.kind === "pick") {
    const [s, r, o] = a.key.split("-");
    icon = `<span class="av sq">${TICKET}</span>`; name = `${s} ${ord(+r)}`; sub = "orig. " + team(s, o); href = "#pick/" + a.key;
    const d = D.draft_results[a.key];
    if (d) extra = `<small class="bec">→ ${esc(pname(d.player_id))}</small>`;
  } else { icon = `<span class="av">$</span>`; name = `$${a.amount} FAAB`; }
  const tag = href ? "a" : "div";
  return `<${tag} class="asset${hit ? " hit" : ""}"${href ? ` href="${esc(href)}"` : ""}>${icon}<span class="nm">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ""}${extra}</span>${val ? `<b class="pt">${esc(val)}</b>` : ""}</${tag}>`;
}

/* ---------- trades: left = what the sender got back, right = what the receiver got ---------- */
function receipts(t) {
  const m = {}, add = (rid, a) => (m[rid] = m[rid] || []).push(a);
  for (const [pid, rid] of Object.entries(t.adds)) add(rid, {kind: "player", id: pid});
  for (const p of t.picks) add(p.to, {kind: "pick", key: pickKey(p)});
  for (const w of t.faab) add(w.to, {kind: "faab", amount: w.amount});
  return m;
}
function tradeRow(t, from, to, isTracked) {
  const rc = receipts(t);
  const col = (rid, label, empty) => `<div class="side"><div class="th">${teamAv(t.season, rid)}<div><div class="team">${esc(team(t.season, rid))}</div><div class="lbl">${label}</div></div></div>
    ${(rc[rid] || []).map(a => assetHtml(a, isTracked(a))).join("") || `<div class="none">${empty}</div>`}</div>`;
  const n = Object.keys(rc).length;
  return `<div class="c"><a class="pill" href="#trade/${esc(t.id)}">${esc(fmt(t.created))} · points ›</a></div>
    <div class="row">${col(from, "Sent it for", "Nothing back")}${col(to, "Acquired", "")}<span class="badge" aria-hidden="true">${ARROW}</span></div>
    ${n > 2 ? `<div class="sub c" style="margin-top:-8px">${n}-team trade: showing the two teams on this asset’s path</div>` : ""}`;
}
const pill = (txt, cls = "", href = "") => `<div class="c"><${href ? "a" : "span"} class="pill ${cls}"${href ? ` href="${esc(href)}"` : ""}>${esc(txt)}</${href ? "a" : "span"}></div><div class="gap"></div>`;

/* ---------- views ---------- */
function draftHero(key, d) {
  const n = Object.keys(D.teams[d.league_season] || {}).length || 12;
  const slot = d.pick_no ? d.pick_no - (d.round - 1) * n : null;
  const p = D.players[d.player_id] || {};
  const pickTxt = slot > 0 ? `Pick ${d.round}.${String(slot).padStart(2, "0")}` : `Round ${d.round}`;
  const head = av(`https://sleepercdn.com/content/nfl/players/thumb/${d.player_id}.jpg`, pname(d.player_id));
  return `<div class="c"><span class="node" aria-hidden="true">${TICKET}</span></div>
    <div class="hero"><div class="hl">Draft selection · ${esc(fmt(d.time))}</div>
      <div class="big">${head}</div>
      <a class="hn" href="#player/${esc(d.player_id)}">${esc(pname(d.player_id))}</a>
      <div class="hs">${esc([p.pos, p.team].filter(Boolean).join(" · "))}</div>
      <div class="chips"><span>${esc(pickTxt)}</span><span>${esc(team(d.league_season, d.by))}</span></div>
      <div class="hs">Used the ${esc(pickLabel(key))}</div></div>`;
}

/* One chronology: pick origin -> pick trades -> draft -> player moves.
   Works from a pick (continues into the player it became) or a player (reaches back to the pick). */
function chain(key, pid) {
  let d = key ? D.draft_results[key] : null;
  if (d && !pid) pid = d.player_id;
  if (!key && pid) {
    const mine = Object.entries(D.draft_results).filter(([, x]) => x.player_id === pid).sort((a, b) => a[1].time - b[1].time);
    if (mine.length) { key = mine[0][0]; d = mine[0][1]; }
  }
  let html = "", holder = null, trades = 0;
  if (key) {
    const [s, r, o] = key.split("-");
    html += pill(`${s} ${ord(+r)} · started with ${team(s, o)}`);
    holder = team(s, o);
    const pre = [];
    for (const t of D.transactions) if (t.type === "trade") for (const p of t.picks)
      if (pickKey(p) === key) pre.push({time: t.created, html: tradeRow(t, p.from, p.to, a => a.kind === "pick" && a.key === key), holder: team(t.season, p.to)});
    pre.sort((a, b) => a.time - b.time);
    for (const e of pre) { html += e.html; holder = e.holder; trades++; }
    if (d) { html += draftHero(key, d); holder = team(d.league_season, d.by); }
  }
  if (pid) {
    const post = [];
    for (const [k, x] of Object.entries(D.draft_results))
      if (x.player_id === pid && k !== key)
        post.push({time: x.time, html: pill(`Drafted ${x.season} R${x.round} · ${team(x.league_season, x.by)}`, "", "#pick/" + k), holder: team(x.league_season, x.by)});
    for (const t of D.transactions) {
      const to = t.adds[pid], from = t.drops[pid];
      if (to == null && from == null) continue;
      if (t.type === "trade") post.push({time: t.created, trade: true, html: tradeRow(t, from, to, a => a.kind === "player" && a.id === pid), holder: team(t.season, to)});
      else if (to != null) post.push({time: t.created, html: pill(`${fmt(t.created)} · Added by ${team(t.season, to)} (${t.type.replace("_", " ")})`), holder: team(t.season, to)});
      else post.push({time: t.created, html: pill(`${fmt(t.created)} · Dropped by ${team(t.season, from)}`), holder: null});
    }
    post.sort((a, b) => a.time - b.time);
    for (const e of post) { html += e.html; holder = e.holder; if (e.trade) trades++; }
  }
  return {html, holder, trades};
}

function buildMatchups() { MATCHUPS = D.matchups || []; }

/* ---------- h2h ---------- */
function computeH2H(oa, ob) {
  let wa = 0, wb = 0, tie = 0, pfa = 0, pfb = 0;
  const games = [];
  for (const {s, w, p} of MATCHUPS) {
    if (p.length !== 2) continue;
    const [x, y] = p, xa = ownerOf(s, x.rid), xb = ownerOf(s, y.rid);
    let a, b;
    if (xa === oa && xb === ob) { a = x; b = y; }
    else if (xa === ob && xb === oa) { a = y; b = x; }
    else continue;
    pfa += a.pts; pfb += b.pts;
    if (a.pts > b.pts) wa++; else if (b.pts > a.pts) wb++; else tie++;
    games.push({s, w, apts: a.pts, bpts: b.pts});
  }
  return {wa, wb, tie, pfa, pfb, games: games.sort((x, y) => y.s.localeCompare(x.s) || y.w - x.w)};
}

        `<a class="chip" style="margin:4px 2px;display:inline-flex;gap:6px;align-items:center" href="#h2h/${oa}/${o}">${uav(o)} ${esc(username(o))}</a>`).join("")}</div>`;

/* ---------- records ---------- */
function leagueRecords() {
  let hi = null, lo = null, cl = null, bl = null;
  const str = {};
  const sorted = [...MATCHUPS].filter(x => x.p.length === 2 && x.p[0].pts > 0 && x.p[1].pts > 0).sort((a, b) => a.s.localeCompare(b.s) || a.w - b.w);
  for (const {s, w, p} of sorted) {
    const [a, b] = p, mg = Math.abs(a.pts - b.pts);
    for (const x of p) {
      if (!hi || x.pts > hi.pts) hi = {...x, s, w};
      if (!lo || x.pts < lo.pts) lo = {...x, s, w};
    }
    if (!cl || mg < Math.abs(cl.p[0].pts - cl.p[1].pts)) cl = {s, w, p};
    if (!bl || mg > Math.abs(bl.p[0].pts - bl.p[1].pts)) bl = {s, w, p};
    for (const x of p) {
      const oid = ownerOf(s, x.rid), opp = p.find(y => y !== x);
      if (!str[oid]) str[oid] = {w:0, l:0, mw:0, ml:0, wSt:null, lSt:null, mwSt:null, mwEn:null, mlSt:null, mlEn:null};
      const st = str[oid], won = x.pts > opp.pts;
      if (won) {
        st.w++; st.l = 0;
        if (st.w === 1) st.wSt = {s, w};
        if (st.w > st.mw) { st.mw = st.w; st.mwSt = st.wSt; st.mwEn = {s, w}; }
        st.lSt = null;
      } else {
        st.l++; st.w = 0;
        if (st.l === 1) st.lSt = {s, w};
        if (st.l > st.ml) { st.ml = st.l; st.mlSt = st.lSt; st.mlEn = {s, w}; }
        st.wSt = null;
      }
    }
  }
  const sa = Object.entries(str).map(([oid, v]) => ({oid, name: username(oid), ...v,
    winActive: v.w > 0 && v.w === v.mw,
    lossActive: v.l > 0 && v.l === v.ml,
  }));
  return {hi, lo, cl, bl, win: [...sa].sort((a, b) => b.mw - a.mw)[0], loss: [...sa].sort((a, b) => b.ml - a.ml)[0]};
}
function viewRecords() {
  if (!MATCHUPS.length) { $("#app").innerHTML = `<h2>Records</h2><p class="hint">Re-run crawl.py to load matchup data.</p>`; return; }
  const r = leagueRecords();
  const rng = (st, en, active) => !st ? "" : ` · ${st.s} Wk ${st.w}${active ? " – present" : (en && (en.s !== st.s || en.w !== st.w)) ? ` – ${en.s} Wk ${en.w}` : ""}`;
  const rec = (val, lbl, sub) => `<div class="rr"><b>${esc(String(val))}</b><span class="ri"><span style="color:var(--fg);font-weight:600">${esc(lbl)}</span><br>${esc(sub)}</span></div>`;
  const game = (g, lbl) => { if (!g) return "";
    const [a, b] = g.p, w = a.pts >= b.pts ? a : b, l = a.pts < b.pts ? a : b;
    return rec(lbl, `${pts1(w.pts)} – ${pts1(l.pts)}`, `${username(ownerOf(g.s, w.rid))} beat ${username(ownerOf(g.s, l.rid))} · ${g.s} Wk ${g.w}`); };
  $("#app").innerHTML = `<h2>League Records</h2><div class="sub">All-time milestones across every season</div>
    <div class="card2">
      ${r.hi ? rec(pts1(r.hi.pts), "Highest score ever", `${username(ownerOf(r.hi.s, r.hi.rid))} · ${r.hi.s} Wk ${r.hi.w}`) : ""}
      ${r.lo ? rec(pts1(r.lo.pts), "Lowest score ever", `${username(ownerOf(r.lo.s, r.lo.rid))} · ${r.lo.s} Wk ${r.lo.w}`) : ""}
      ${game(r.bl, "Biggest blowout")}
      ${game(r.cl, "Closest game")}
      ${r.win ? rec(r.win.mw + " W", "Longest win streak" + (r.win.winActive ? " (active)" : ""), r.win.name + rng(r.win.mwSt, r.win.mwEn, r.win.winActive)) : ""}
      ${r.loss ? rec(r.loss.ml + " L", "Longest loss streak" + (r.loss.lossActive ? " (active)" : ""), r.loss.name + rng(r.loss.mlSt, r.loss.mlEn, r.loss.lossActive)) : ""}
    </div>`;
}
/* ---------- luck index ---------- */
function luckIndex() {
  // Pool all teams' scores for the same week so expected wins spans the full field
  const byWeek = {};
  for (const {s, w, p} of MATCHUPS)
    for (const x of p) (byWeek[`${s}-${w}`] = byWeek[`${s}-${w}`] || []).push({oid: ownerOf(s, x.rid), pts: x.pts});
  const exp = {}, act = {}, gms = {};
  for (const scores of Object.values(byWeek)) {
    const n = scores.length; if (n < 2) continue;
    for (const {oid, pts} of scores) {
      const oth = scores.filter(x => x.oid !== oid);
      exp[oid] = (exp[oid] || 0) + oth.reduce((a, x) => a + (x.pts < pts ? 1 : x.pts === pts ? 0.5 : 0), 0) / oth.length;
      gms[oid] = (gms[oid] || 0) + 1;
    }
  }
  for (const {s, p} of MATCHUPS) {
    if (p.length !== 2) continue;
    const [a, b] = p, oa = ownerOf(s, a.rid), ob = ownerOf(s, b.rid);
    act[oa] = (act[oa] || 0) + (a.pts > b.pts ? 1 : a.pts === b.pts ? 0.5 : 0);
    act[ob] = (act[ob] || 0) + (b.pts > a.pts ? 1 : a.pts === b.pts ? 0.5 : 0);
  }
  return Object.keys(exp).map(oid => ({oid, name: username(oid),
    exp: exp[oid], act: act[oid] || 0, gms: gms[oid] || 0, luck: (act[oid] || 0) - exp[oid]
  })).sort((a, b) => b.luck - a.luck);
}
function viewLuck() {
  if (!MATCHUPS.length) { $("#app").innerHTML = `<h2>Luck Index</h2><p class="hint">Re-run crawl.py to load matchup data.</p>`; return; }
  const rows = luckIndex();
  const list = rows.map(r => {
    const lk = r.luck, pos = lk >= 0;
    return `<div class="lrow">${uav(r.oid)}<span style="flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
      <span class="mut" style="font-size:.78rem;min-width:52px;text-align:right">${r.act}W-${r.gms - Math.round(r.act)}L</span>
      <span class="lp ${pos ? "lpos" : "lneg"}">${pos ? "+" : ""}${pts1(lk)}</span></div>`;
  }).join("");
  $("#app").innerHTML = `<h2>Luck Index</h2>
    <div class="sub">Actual wins minus expected wins (if you played everyone each week). Covers all regular-season weeks.</div>
    <div class="card2">${list}</div>
    <p class="hint">+ = luckier than record suggests &nbsp;·&nbsp; − = tougher schedule than average</p>`;
}

/* ---------- boot ---------- */
function buildItems() {
  const pids = new Set(), keys = new Set();
  for (const t of D.transactions) {
    Object.keys(t.adds).forEach(p => pids.add(p));
    Object.keys(t.drops).forEach(p => pids.add(p));
    t.picks.forEach(p => keys.add(pickKey(p)));
  }
  for (const [k, d] of Object.entries(D.draft_results)) { pids.add(d.player_id); keys.add(k); }
  for (const pid of pids) {
    const p = D.players[pid] || {name: pid}, tag = [p.pos, p.team].filter(Boolean).join(" · ");
    ITEMS.push({type: "player", id: pid, label: p.name, tag, icon: headshot(pid), hay: (p.name + " " + tag).toLowerCase()});
  }
  [...keys].sort().reverse().forEach(k => {
    const [, r] = k.split("-"), label = pickLabel(k);
    ITEMS.push({type: "pick", id: k, label, tag: D.draft_results[k] ? "Became " + pname(D.draft_results[k].player_id) : "Pick",
      icon: `<span class="av sq">${TICKET}</span>`, hay: (label + " " + ord(+r) + " round " + r).toLowerCase()});
  });
}

    D = data; buildPoints(); buildMatchups(); buildItems();
    $("#foot").textContent = "Data updated " + fmt(Date.parse(D.generated));
    addEventListener("hashchange", route); route();
  })
  .catch(() => { $("#app").innerHTML = `<p class="hint">Couldn’t load history.json. Run crawl.py first, and serve this folder over http (not file://).</p>`; });
</script>
</body>
</html>
